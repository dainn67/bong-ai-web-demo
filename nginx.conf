# The production twin of the dev proxy in vite.config.ts.
#
# Lesson mode fetches `/api`, `/cdn`, `/stt` and `/media` as same-origin paths
# because those upstreams either send no CORS headers at all or whitelist only
# the dev ports. Vite answers them under `npm run dev`; without the blocks below
# the SPA fallback answers them here instead, and the first `response.json()`
# fails with `Unexpected token '<', "<!doctype "...`. Keep the two lists in step.
#
# Every proxy_pass target is built from a variable so nginx resolves it per
# request rather than at startup: these hosts are behind Cloudflare, whose
# addresses move. That is what the `resolver` line is for. And every upstream
# vhosts on SNI, so `proxy_ssl_server_name on` is not optional -- without it the
# handshake carries no name and the front end answers with the wrong certificate.
server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # A turn of recorded audio goes up to the STT service in one POST, which the
    # 1m default would reject.
    client_max_body_size 25m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Auth + lessons. No rewrite: the client already sends the `/api/v1` prefix
    # the backend expects.
    location /api/ {
        set $upstream_api "https://bong-api.bcserver.xyz";
        proxy_pass $upstream_api$request_uri;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # Lesson catalog and metadata JSON, plus cover art.
    location /cdn/ {
        set $upstream_cdn "https://static-bongai.bcserver.xyz";
        rewrite ^/cdn/(.*)$ /$1 break;
        proxy_pass $upstream_cdn;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # FunASR transcription. Slow by nature -- the client waits 20s for it, so the
    # proxy must not give up first.
    location /stt/ {
        set $upstream_stt "https://mini-3000.bcserver.xyz";
        rewrite ^/stt/(.*)$ /$1 break;
        proxy_pass $upstream_stt;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Story audio that is not on the open r2.dev bucket.
    location /media/ {
        set $upstream_media "https://files.bcserver.xyz";
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $upstream_media;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # No error_page for 5xx: `dist/` overwrites the image's html root and ships
    # no 50x.html, so pointing there turned an upstream 502 into a 404 -- the
    # wrong status to be staring at while debugging a proxy. nginx's built-in
    # pages report what actually happened.
}
