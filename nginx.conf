# The production twin of the dev proxy in vite.config.ts.
#
# One route, and it is not part of running the device. The badge speaks to the
# OTA endpoint and the WebSocket, both of which it reaches directly — OTA sends
# `Access-Control-Allow-Origin: *` and a WebSocket is not subject to CORS at
# all. Lesson content never touches the browser: xiaozhi-server fetches the
# clips and pushes them down the socket as Opus.
#
# What is left is `bind-by-phone`, which provisions the simulator against a
# parent account once. `bong-api` does not whitelist this origin, so it comes
# through here. Keep this in step with the `proxy` block in vite.config.ts.
#
# The proxy_pass target is built from a variable so nginx resolves it per
# request rather than at startup: the host is behind Cloudflare, whose addresses
# move. That is what the `resolver` line is for. And it vhosts on SNI, so
# `proxy_ssl_server_name on` is not optional — without it the handshake carries
# no name and the front end answers with the wrong certificate.
server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS.
    resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Provisioning. No rewrite: the client already sends the `/api/v1` prefix
    # the backend expects.
    location /api/ {
        set $upstream_api "https://bong-api.bcserver.xyz";
        proxy_pass $upstream_api$request_uri;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # No error_page for 5xx: `dist/` overwrites the image's html root and ships
    # no 50x.html, so pointing there turned an upstream 502 into a 404 -- the
    # wrong status to be staring at while debugging a proxy. nginx's built-in
    # pages report what actually happened.
}
