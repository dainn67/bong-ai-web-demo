<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <clipPath id="circleClip"><circle cx="180" cy="180" r="180" /></clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Zone 1 -->
    <path d="M 180,180 L 180.00,0.00 A 180,180 0 0 1 335.88,90.00 Z" fill="#fee2e2" stroke="#ffffff" stroke-width="2" />
    <text x="241" y="57" text-anchor="middle" font-size="28" dominant-baseline="central">1️⃣</text>
    <text x="241" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b" font-family="sans-serif">SỐ 1</text>

    <!-- Zone 2 -->
    <path d="M 180,180 L 335.88,90.00 A 180,180 0 0 1 335.88,270.00 Z" fill="#fef3c7" stroke="#ffffff" stroke-width="2" />
