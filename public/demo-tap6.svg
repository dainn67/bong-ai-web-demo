    <text x="302" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e" font-family="sans-serif">SỐ 2</text>

    <!-- Zone 3 -->
    <path d="M 180,180 L 335.88,270.00 A 180,180 0 0 1 180.00,360.00 Z" fill="#dcfce7" stroke="#ffffff" stroke-width="2" />
    <text x="241" y="267" text-anchor="middle" font-size="28" dominant-baseline="central">3️⃣</text>
    <text x="241" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534" font-family="sans-serif">SỐ 3</text>

    <!-- Zone 4 -->
    <path d="M 180,180 L 180.00,360.00 A 180,180 0 0 1 24.12,270.00 Z" fill="#e0f2fe" stroke="#ffffff" stroke-width="2" />
    <text x="119" y="267" text-anchor="middle" font-size="28" dominant-baseline="central">4️⃣</text>
    <text x="119" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985" font-family="sans-serif">SỐ 4</text>

    <!-- Zone 5 -->
    <path d="M 180,180 L 24.12,270.00 A 180,180 0 0 1 24.12,90.00 Z" fill="#f3e8ff" stroke="#ffffff" stroke-width="2" />
    <text x="58" y="162" text-anchor="middle" font-size="28" dominant-baseline="central">5️⃣</text>
    <text x="58" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8" font-family="sans-serif">SỐ 5</text>

    <!-- Zone 6 -->
    <path d="M 180,180 L 24.12,90.00 A 180,180 0 0 1 180.00,0.00 Z" fill="#ffedd5" stroke="#ffffff" stroke-width="2" />
    <text x="119" y="57" text-anchor="middle" font-size="28" dominant-baseline="central">6️⃣</text>
    <text x="119" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412" font-family="sans-serif">SỐ 6</text>

    <!-- Dead Zone at Center (r = 63px - 35%) -->
    <circle cx="180" cy="180" r="63" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" />
    <text x="180" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b" font-family="sans-serif">VÙNG CHẾT</text>
    <text x="180" y="190" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">(cham_khac)</text>
  </g>
  <circle cx="180" cy="180" r="179" fill="none" stroke="#334155" stroke-width="2" />
</svg>
