<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <clipPath id="circleClip"><circle cx="180" cy="180" r="180" /></clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Zone 1 (12h: [-30deg, 30deg]) -->
    <path d="M 180,180 L 90,24.12 A 180,180 0 0 1 270,24.12 Z" fill="#fee2e2" stroke="#ffffff" stroke-width="2" />
    <text x="180" y="65" text-anchor="middle" font-size="28" dominant-baseline="central">1️⃣</text>
    <text x="180" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b" font-family="sans-serif">SỐ 1</text>

    <!-- Zone 2 (2h: [30deg, 90deg]) -->
    <path d="M 180,180 L 270,24.12 A 180,180 0 0 1 360,180 Z" fill="#fef3c7" stroke="#ffffff" stroke-width="2" />
    <text x="270" y="115" text-anchor="middle" font-size="28" dominant-baseline="central">2️⃣</text>
    <text x="270" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e" font-family="sans-serif">SỐ 2</text>

    <!-- Zone 3 (4h: [90deg, 150deg]) -->
    <path d="M 180,180 L 360,180 A 180,180 0 0 1 270,335.88 Z" fill="#dcfce7" stroke="#ffffff" stroke-width="2" />
    <text x="270" y="245" text-anchor="middle" font-size="28" dominant-baseline="central">3️⃣</text>
    <text x="270" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534" font-family="sans-serif">SỐ 3</text>

    <!-- Zone 4 (6h: [150deg, 210deg]) -->
    <path d="M 180,180 L 270,335.88 A 180,180 0 0 1 90,335.88 Z" fill="#e0f2fe" stroke="#ffffff" stroke-width="2" />
    <text x="180" y="295" text-anchor="middle" font-size="28" dominant-baseline="central">4️⃣</text>
    <text x="180" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985" font-family="sans-serif">SỐ 4</text>

    <!-- Zone 5 (8h: [210deg, 270deg]) -->
    <path d="M 180,180 L 90,335.88 A 180,180 0 0 1 0,180 Z" fill="#f3e8ff" stroke="#ffffff" stroke-width="2" />
    <text x="90" y="245" text-anchor="middle" font-size="28" dominant-baseline="central">5️⃣</text>
    <text x="90" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8" font-family="sans-serif">SỐ 5</text>

    <!-- Zone 6 (10h: [270deg, 330deg]) -->
    <path d="M 180,180 L 0,180 A 180,180 0 0 1 90,24.12 Z" fill="#ffedd5" stroke="#ffffff" stroke-width="2" />
    <text x="90" y="115" text-anchor="middle" font-size="28" dominant-baseline="central">6️⃣</text>
    <text x="90" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412" font-family="sans-serif">SỐ 6</text>

    <!-- Dead Zone at Center (r = 63px - 35%) -->
    <circle cx="180" cy="180" r="63" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" />
    <text x="180" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b" font-family="sans-serif">VÙNG CHẾT</text>
    <text x="180" y="190" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">(cham_khac)</text>
  </g>
  <circle cx="180" cy="180" r="179" fill="none" stroke="#334155" stroke-width="2" />
</svg>
