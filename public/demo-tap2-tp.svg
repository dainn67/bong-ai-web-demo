<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <clipPath id="circleClip"><circle cx="180" cy="180" r="180" /></clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Zone 1 (Left - Táo Đỏ): x <= 180 -->
    <path d="M 0,0 L 180,0 L 180,360 L 0,360 Z" fill="#fee2e2" stroke="#ffffff" stroke-width="2" />
    <text x="90" y="150" text-anchor="middle" font-size="44" dominant-baseline="central">🍎</text>
    <text x="90" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b" font-family="sans-serif">1. TÁO ĐỎ</text>

    <!-- Zone 2 (Right - Chuối Vàng): x > 180 -->
    <path d="M 180,0 L 360,0 L 360,360 L 180,360 Z" fill="#fef9c3" stroke="#ffffff" stroke-width="2" />
    <text x="270" y="150" text-anchor="middle" font-size="44" dominant-baseline="central">🍌</text>
    <text x="270" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e" font-family="sans-serif">2. CHUỐI VÀNG</text>

    <!-- Divider Line (Không có vùng chết) -->
    <line x1="180" y1="0" x2="180" y2="360" stroke="#ffffff" stroke-width="3" />
  </g>
  <circle cx="180" cy="180" r="179" fill="none" stroke="#334155" stroke-width="2" />
</svg>
