<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <clipPath id="circleClip"><circle cx="180" cy="180" r="180" /></clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Zone 1 (0deg -> 120deg, clockwise from 12h) -->
    <path d="M 180,180 L 180.00,0.00 A 180,180 0 0 1 335.88,270.00 Z" fill="#e0e7ff" stroke="#ffffff" stroke-width="2.5" />
    <text x="277" y="106" text-anchor="middle" font-size="40" dominant-baseline="central">✈️</text>
    <text x="277" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3" font-family="sans-serif">1. MÁY BAY</text>

    <!-- Zone 2 (120deg -> 240deg, clockwise from 12h) -->
    <path d="M 180,180 L 335.88,270.00 A 180,180 0 0 1 24.12,270.00 Z" fill="#ccfbf1" stroke="#ffffff" stroke-width="2.5" />
    <text x="180" y="274" text-anchor="middle" font-size="40" dominant-baseline="central">🚢</text>
    <text x="180" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#115e59" font-family="sans-serif">2. TÀU THỦY</text>

    <!-- Zone 3 (240deg -> 360deg, clockwise from 12h) -->
    <path d="M 180,180 L 24.12,270.00 A 180,180 0 0 1 180.00,0.00 Z" fill="#fef3c7" stroke="#ffffff" stroke-width="2.5" />
    <text x="83" y="106" text-anchor="middle" font-size="40" dominant-baseline="central">🚗</text>
    <text x="83" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e" font-family="sans-serif">3. Ô TÔ</text>

    <!-- Dead Zone at Center (r = 45px) -->
    <circle cx="180" cy="180" r="45" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" />
    <text x="180" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b" font-family="sans-serif">VÙNG CHẾT</text>
    <text x="180" y="188" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">(cham_khac)</text>
  </g>
  <circle cx="180" cy="180" r="179" fill="none" stroke="#334155" stroke-width="2" />
</svg>
